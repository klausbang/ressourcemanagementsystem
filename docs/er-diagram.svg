<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .entity { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 8; ry: 8; }
      .entity-data { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; rx: 8; ry: 8; }
      .entity-link { fill: #ecfeff; stroke: #115e59; stroke-width: 2; rx: 8; ry: 8; }
      .ename { font: 700 16px Arial, sans-serif; fill: #0f172a; }
      .attr { font: 13px Arial, sans-serif; fill: #1f2937; }
      .line { stroke: #334155; stroke-width: 2; fill: none; }
      .card { font: 12px Arial, sans-serif; fill: #111827; }
    </style>
  </defs>

  <text x="35" y="45" class="title">RMS ER Model (Phase 4)</text>

  <rect x="60" y="100" width="250" height="160" class="entity"/>
  <text x="80" y="128" class="ename">users</text>
  <text x="80" y="150" class="attr">PK id</text>
  <text x="80" y="170" class="attr">username (unique)</text>
  <text x="80" y="190" class="attr">role {admin|planner}</text>

  <rect x="380" y="90" width="300" height="190" class="entity-data"/>
  <text x="400" y="118" class="ename">resources</text>
  <text x="400" y="140" class="attr">PK id</text>
  <text x="400" y="160" class="attr">code (unique)</text>
  <text x="400" y="180" class="attr">name</text>
  <text x="400" y="200" class="attr">resource_type</text>
  <text x="400" y="220" class="attr">status</text>

  <rect x="760" y="100" width="280" height="170" class="entity-data"/>
  <text x="780" y="128" class="ename">capabilities</text>
  <text x="780" y="150" class="attr">PK id</text>
  <text x="780" y="170" class="attr">name (unique)</text>
  <text x="780" y="190" class="attr">description</text>

  <rect x="520" y="330" width="360" height="150" class="entity-link"/>
  <text x="540" y="358" class="ename">resource_capabilities</text>
  <text x="540" y="380" class="attr">PK (resource_id, capability_id)</text>
  <text x="540" y="400" class="attr">FK resource_id -> resources.id</text>
  <text x="540" y="420" class="attr">FK capability_id -> capabilities.id</text>

  <rect x="80" y="560" width="320" height="180" class="entity-data"/>
  <text x="100" y="588" class="ename">customer_orders</text>
  <text x="100" y="610" class="attr">PK id</text>
  <text x="100" y="630" class="attr">order_code (unique)</text>
  <text x="100" y="650" class="attr">customer_name</text>
  <text x="100" y="670" class="attr">product_name</text>

  <rect x="460" y="560" width="360" height="200" class="entity-data"/>
  <text x="480" y="588" class="ename">ordered_tests</text>
  <text x="480" y="610" class="attr">PK id</text>
  <text x="480" y="630" class="attr">FK order_id -> customer_orders.id</text>
  <text x="480" y="650" class="attr">test_name</text>
  <text x="480" y="670" class="attr">FK required_capability_id -> capabilities.id</text>

  <rect x="900" y="560" width="430" height="240" class="entity-link"/>
  <text x="920" y="588" class="ename">allocations</text>
  <text x="920" y="610" class="attr">PK id</text>
  <text x="920" y="630" class="attr">FK ordered_test_id (unique) -> ordered_tests.id</text>
  <text x="920" y="650" class="attr">FK resource_id -> resources.id</text>
  <text x="920" y="670" class="attr">FK planner_user_id -> users.id</text>
  <text x="920" y="690" class="attr">notes</text>

  <line x1="530" y1="280" x2="620" y2="330" class="line"/>
  <text x="560" y="300" class="card">1</text>
  <text x="620" y="322" class="card">N</text>

  <line x1="840" y1="270" x2="780" y2="330" class="line"/>
  <text x="825" y="292" class="card">1</text>
  <text x="785" y="322" class="card">N</text>

  <line x1="400" y1="650" x2="460" y2="650" class="line"/>
  <text x="412" y="642" class="card">1</text>
  <text x="438" y="642" class="card">N</text>

  <line x1="820" y1="650" x2="900" y2="650" class="line"/>
  <text x="830" y="642" class="card">1</text>
  <text x="878" y="642" class="card">N</text>

  <line x1="1040" y1="560" x2="1040" y2="480" class="line"/>
  <line x1="1040" y1="480" x2="650" y2="480" class="line"/>
  <line x1="650" y1="480" x2="650" y2="560" class="line"/>
  <text x="1010" y="500" class="card">ordered_test_id 1:1 per test</text>

  <line x1="1110" y1="560" x2="1110" y2="250" class="line"/>
  <line x1="1110" y1="250" x2="680" y2="185" class="line"/>
  <text x="1050" y="300" class="card">resource_id N:1</text>

  <line x1="950" y1="560" x2="240" y2="260" class="line"/>
  <text x="770" y="420" class="card">planner_user_id N:1</text>

  <text x="70" y="860" class="ename">Relationship Summary</text>
  <text x="70" y="885" class="attr">- resources and capabilities are many-to-many via resource_capabilities.</text>
  <text x="70" y="908" class="attr">- customer_orders and ordered_tests are one-to-many.</text>
  <text x="70" y="931" class="attr">- each ordered_test can have at most one allocation (unique ordered_test_id).</text>
  <text x="70" y="954" class="attr">- allocations record which planner user performed assignment.</text>
</svg>
